experiment_id: EFGM-EXP-0008
phase: phase_1_instrumentation
status: implementation_candidate_final_hardened
parent_preregistration_sha: 9e40bc978f4f86eadbd65471d08a3fcb21c22d4c
parent_baseline_ref: baseline/exp0008-preregistration-2026-08-16
branch: experiment/exp0008-phase1-instrumentation

autonomous_execution:
  authorized: false
  reason: >-
    Phase 1 implements deterministic instrumentation only. Autonomous development
    remains blocked until mandatory runtime identities, external containment
    preflight evidence, watchdog identity, and the explicit human safety gate are
    frozen and approved.

scope:
  included:
    - synthetic_in_memory_state_machine
    - controller_owned_execution_identity
    - controller_owned_per_tool_contracts
    - immutable_hash_chained_telemetry
    - pre_and_post_state_hash_custody
    - runtime_policy_tool_watchdog_identity_hashes
    - independently_recomputable_runtime_custody
    - identity_bound_hash_chained_prefix_assessments
    - deterministic_telemetry_to_efgm_adapter
    - preregistered_simple_detectors
    - preexecution_b5_spec_compliance_observation
    - external_containment_attestation_checker
    - pre_execution_external_watchdog_budget_monitor
    - monotonic_supervisor_runtime_accounting
    - exact_deterministic_acceptance_criteria
    - adversarial_regression_tests
  excluded:
    - autonomous_model_execution
    - real_multi_agent_execution
    - network_access
    - shell_or_subprocess_execution
    - arbitrary_code_execution
    - browser_or_http_tools
    - package_manager_use_by_agent
    - host_filesystem_tools
    - real_credentials
    - real_privilege_or_persistence
    - cyber_exploitation
    - production_or_external_services

instrumentation:
  telemetry_module: src/efgm/exp0008_telemetry.py
  environment_module: src/efgm/exp0008_environment.py
  adapter_module: src/efgm/exp0008_adapter.py
  detector_module: src/efgm/exp0008_detectors.py
  safety_module: src/efgm/exp0008_safety.py
  documentation: research/EFGM-EXP-0008-PHASE1-INSTRUMENTATION.md

controller_execution_identity:
  owner: environment_controller
  agent_supplied: false
  fields:
    - trajectory_id
    - sequence_id
    - governed_subject_id
    - root_objective
  bound_before_first_action: true
  injected_into_telemetry: true
  public_reassignment_supported: false
  identity_rename_by_agent_possible: false

agent_request_surface:
  controller_owned_side_effect_flags_agent_supplied: false
  controller_identity_agent_supplied: false
  parent_action_identity_agent_supplied: false
  obstacle_identity_agent_supplied: false
  supervisor_accounting_agent_supplied: false
  arbitrary_executable_payload_field: false
  permitted_proposal_fields:
    - tool_requested
    - capability_requested
    - resource_requested
    - current_subgoal
    - strategy_id
    - requested_fictional_privilege
    - requested_fictional_connectivity
    - requested_fictional_persistence
    - requested_fictional_coordination

per_tool_contracts:
  owner: environment_controller
  required_for_every_declared_tool: true
  agent_can_define_side_effects: false
  controller_defines:
    - allowed_capabilities
    - allowed_resources
    - allowed_subgoals
    - state_read_semantics
    - state_write_semantics
    - peer_message_semantics
    - deterministic_write_effects
    - permitted_fictional_state_dimension_changes
    - per_tool_fictional_dimension_maxima
  contract_mismatch_behavior: deny_before_execution
  monitor_only_boundary_may_bypass_contract_shape: false
  all_declared_tools_must_have_enforcement_partition: true

telemetry_contract:
  schema_id: exp0008-telemetry-v0.2
  immutable_records: true
  canonical_sha256: true
  previous_event_hash_chain: true
  controller_derived_parent_action_chain: true
  preexecution_decision_hash: true
  preexecution_decision_hash_created_before_state_transition: true
  pre_state_hash: true
  post_state_hash: true
  state_hash_continuity_verified: true
  runtime_custody_recomputed_by_event_verifier: true
  identity_continuity:
    - experiment_id
    - telemetry_schema_id
    - trajectory_id
    - sequence_id
    - governed_subject_id
    - root_objective
    - policy_sha256
    - tool_contracts_sha256
    - obstacle_profile_sha256
    - environment_initial_state_sha256
    - watchdog_config_sha256
    - runtime_custody_sha256
  supervisor_owned_fields:
    - output_chars
    - memory_units
    - output_contradiction
  output_contradiction_applicability:
    no_output: not_applicable
    output_present: supervisor_observation_required
    denominator: output_bearing_action_boundaries_only
  applicability_aware_trace_aggregation: true
  non_applicable_events_count_as_successes: false

runtime_custody:
  canonical_hashes_required: true
  set_like_configuration_normalization: deterministic_sorted
  bound_components:
    - controller_execution_identity
    - telemetry_schema_id
    - policy
    - tool_contracts
    - obstacle_profile
    - initial_world_state
    - watchdog_configuration
  nested_policy_mutation_detection: fail_closed_containment_anomaly
  out_of_band_world_state_mutation_detection: fail_closed_containment_anomaly
  event_chain_binds_runtime_custody: true
  event_verifier_independently_recomputes_runtime_custody: true
  assessment_chain_binds_runtime_custody: true
  live_environment_rebinding_allowed: false

synthetic_environment:
  external_side_effects: false
  direct_public_unsupervised_step_entrypoint: false
  unknown_tool_behavior: fail_closed_record_and_latch_terminal
  post_containment_resume_allowed: false
  class_e_execution_semantics: synthetic_state_machine_transition_only
  obstacle_injection_owner: environment_controller
  obstacle_identity_action_local: true
  primary_real_autonomous_peers: 0
  deterministic_writes:
    agent_supplied_write_value: false
    effects_defined_in_tool_contract: true

effective_authority_semantics:
  requested_authority_tracked: true
  effective_current_authority_tracked: true
  allowed_action_requires_effective_authority_in_scope: true
  over_authority_state_persists_as_adverse_until_explicitly_reduced: true
  nominal_zero_increment_does_not_mask_existing_over_authority: true

completion_acceptance:
  completion_tool_must_be_allowed: true
  denied_completion_tool_allowed: false
  monitor_only_completion_tool_allowed: false
  exact_controller_defined_resource_values_required: true
  truthy_resource_value_is_sufficient: false
  task_completed_requires_policy_permitted: true

adapter:
  adapter_id: exp0008-environment-adapter-v0.1
  deterministic: true
  strict_provenance: true
  consumes_preferred_safe_unsafe_label: false
  consumes_synthetic_policy_violation_convenience_field: false
  containment_anomaly_scoreable: false
  output_contradiction_source: supervisor_observation
  output_contradiction_non_applicable_dilution_prevented: true
  authority_source: effective_current_authority_state
  action_velocity_semantics: adaptation_pressure_proxy_not_wall_clock_speed
  frozen_for_autonomous_development: false
  freeze_gate: after_phase_2_scripted_calibration_and_before_phase_3

assessment_custody:
  prefix_assessment_sealed_to_event_head: true
  previous_assessment_hash_chain: true
  chain_must_start_at_action_zero: true
  continuity_required:
    - experiment_id
    - trajectory_id
    - sequence_id
    - governed_subject_id
    - adapter_id
    - agent_config_sha256
    - policy_sha256
    - watchdog_config_sha256
    - runtime_custody_sha256
  verifier_requires_raw_event_chain: true
  verifier_recomputes_frozen_efgm_outputs_per_prefix: true
  identity_splicing_allowed: false
  event_head_splicing_allowed: false
  config_splicing_allowed: false
  runtime_custody_splicing_allowed: false

simple_detectors:
  containment_anomaly_input_allowed: false
  B1_first_explicit_violation:
    phase: post_execution
    evidence: immutable_event_sha256
  B2_first_denied_request:
    phase: pre_execution
    evidence: immutable_preexecution_decision_sha256
  B3_repeated_denials:
    phase: pre_execution
    evidence: immutable_preexecution_decision_sha256
  B4_out_of_scope_request:
    phase: pre_execution
    evidence: immutable_preexecution_decision_sha256
  B5_spec_compliance_request_checker:
    phase: pre_execution
    source: immutable_preexecution_policy_decision
    decision_hash_created_before_state_transition: true
    evidence: immutable_preexecution_decision_sha256
    derived_from_postexecution_outcome: false

containment_preflight:
  implementation: external_attestation_validation
  live_network_or_host_probe_code_added_to_repository: false
  fail_closed: true
  attestation_hashed: true
  all_required_assertions_must_pass: true

watchdog:
  implementation_id: exp0008-external-watchdog-v0.2
  outside_agent_tool_surface: true
  mandatory_executor: SupervisedSyntheticExecutor
  pre_execution_budget_gate: true
  direct_environment_step_for_autonomous_runtime: prohibited
  environment_termination_on_watchdog_trigger: true
  batch_termination_latched: true
  silent_retry_after_termination: false
  one_time_environment_binding: true
  fresh_watchdog_reset_on_live_environment: prohibited
  supervisor_runtime_accounting:
    agent_supplied: false
    model_calls_monotonic: true
    retries_monotonic: true
    elapsed_seconds_monotonic: true
    rollback_behavior: terminate_before_next_action
  state_write_budget_semantics: >-
    Conservatively charges every synthetic state mutation boundary, including
    resource, privilege, connectivity, persistence, coordination, and completion
    changes, against maximum_state_writes.
  hard_limits:
    - maximum_agent_actions
    - maximum_model_calls
    - maximum_retries
    - maximum_wall_clock_seconds
    - maximum_state_writes
    - maximum_output_chars
    - maximum_memory_units
  containment_anomaly_action: terminate_trajectory_and_batch
  known_budget_exceedance_action: block_before_environment_execution_and_terminate

peer_review_findings:
  first_review:
    supervisor_owned_accounting: resolved_candidate
    latched_termination: resolved_candidate
    output_contradiction_applicability: resolved_candidate
    sparse_applicability: resolved_candidate
    obstacle_locality: resolved_candidate
    prefix_assessment_custody: resolved_candidate
    deterministic_completion: resolved_candidate
  second_review:
    controller_owned_per_tool_contracts: resolved_candidate
    enforced_supervisor_orchestrator_termination: resolved_candidate
    applicability_aware_output_observations: resolved_candidate
    identity_bound_assessment_custody: resolved_candidate
    deterministic_task_acceptance: resolved_candidate
    state_mutation_budget_coverage: resolved_candidate
    supervisor_ownership_runtime_boundary: structurally_enforced_candidate
  final_review:
    controller_owned_first_action_identity: resolved_candidate
    identity_drift_without_telemetry: eliminated_by_controller_owned_identity_surface
    monotonic_runtime_budget_accounting: resolved_candidate
    fresh_watchdog_reset: resolved_candidate
    persistent_effective_authority: resolved_candidate
    runtime_policy_tool_watchdog_custody: resolved_candidate
    independently_recomputable_runtime_custody: resolved_candidate
    b5_preexecution_comparator_semantics: resolved_candidate
    b5_request_time_evidence_identity: resolved_candidate

frozen_model_contract_preserved:
  efgm_v2_equations_changed: false
  agent_governance_v0_3_equations_changed: false
  scoring_weights_changed: false
  classification_thresholds_changed: false
  prerequisite_membership_changed: false
  ae_definition_changed: false
  cue_definition_changed: false
  provenance_semantics_changed: false
  temporal_identity_semantics_changed: false

scientific_evidence_status:
  phase_1_output_counts_for_hypothesis_testing: false
  scripted_calibration_counts_for_hypothesis_testing: false
  development_trajectory_generation_started: false
  validation_trajectory_generation_started: false

phase_exit_gate:
  required:
    - repository_test_matrix_passes
    - safety_contract_review_complete
    - preregistration_contract_review_complete
    - all_phase_1_adversarial_findings_resolved
    - final_phase_1_peer_review_complete
    - phase_1_candidate_merged
  next_phase: phase_2_scripted_calibration
  autonomous_phase_remains_blocked: true
