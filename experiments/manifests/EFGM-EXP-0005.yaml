experiment_id: EFGM-EXP-0005
title: "Temporal intervention, residual state, and recovery in Agent Governance"
date: 2026-08-10
status: execution_ready
research_type: falsification

hypothesis: "Agent-governance state transitions and residual-state evidence contain useful information not represented by a single static Agent Governance v0.3 snapshot, especially after governance intervention."
null_hypothesis: "Static governance-state scores are sufficient; transition deltas, residual-state checks, and recovery signals add no stable diagnostic value."

predeclared_success_criteria:
  - "Every compared transition belongs to one explicit sequence_id; unrelated sequences are rejected rather than compared as recovery states."
  - "Recovery progress is emitted only for a declared pre_intervention -> post_intervention transition with higher GI and lower AE."
  - "Verified recovery requires a governed post-state, complete residual evidence, no material residuals, no configured candidate-prerequisite breach, and no elevated AE/CUE condition."
  - "Residual credentials, persistence, environmental memory, coordination, privileges, scheduled actions, irreversible side effects, rollback gaps, or unknown residual state block verified recovery."
  - "Temporal verified-recovery interpretation improves accuracy over treating the final static governed classification as a recovery proxy."
  - "Any semantic-completeness claim must survive preregistered validation cases with catastrophic governance failures outside the current candidate prerequisite set."

predeclared_failure_criteria:
  - "States from different sequence identities can be interpreted as one recovery transition."
  - "Recovery progress is emitted for invalid phase, missing intervention, or no improvement."
  - "Verified recovery remains positive with a material residual, unknown residual, covered candidate-prerequisite breach, or governance-deficient post-state."
  - "Verified recovery accepts preregistered catastrophic uncovered governance failures solely because the current candidate prerequisite list does not include those paths."
  - "Temporal verified recovery adds no accuracy over final static classification or is matched/exceeded by a simpler explicit recovery-invariant checklist."
  - "Results are unstable under small numeric evidence perturbations."

