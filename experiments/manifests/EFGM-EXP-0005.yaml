experiment_id: EFGM-EXP-0005
title: "Temporal intervention and recovery in governed agentic flow"
date: 2026-08-10
status: planned
research_type: falsification

hypothesis: "Agent-governance state transitions contain useful information not represented by a single static v0.3 snapshot, especially after governance intervention."
null_hypothesis: "Static governance-state scores are sufficient; transition deltas and intervention/recovery signals add no stable diagnostic value."
predeclared_success_criteria:
  - "State transitions correctly preserve before/after score identities and direction of GI, AE, and CUE changes."
  - "Governance interventions that restore authorized controls produce higher GI and lower AE in preregistered recovery cases."
  - "Partial interventions with residual credentials, persistence, memory, or coordination do not receive the same recovery interpretation as complete-control cases."
  - "Transition diagnostics add information beyond comparing final static classifications alone."
predeclared_failure_criteria:
  - "Transition metrics are redundant with final-state classification."
  - "Recovery signals remain positive despite preregistered material residual agency/control failures."
  - "Results are unstable under small evidence perturbations."

