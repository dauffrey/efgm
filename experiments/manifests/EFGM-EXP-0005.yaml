conclusion:
  decision: do_not_promote_current_verified_recovery_semantics
  rationale: "Temporal and residual-state evidence materially improved recovery interpretation relative to the final static governed-state proxy, and sequence identity plus covered residual/prerequisite checks behaved as intended. However, validation verified-recovery accuracy fell to 83.33% with an 18.18% false-positive rate because two preregistered catastrophic governance failures outside the current candidate prerequisite set were falsely verified. A broader explicit recovery-invariant checklist achieved 100% validation accuracy. The current verified-recovery semantics therefore inherit known prerequisite-set incompleteness and are not eligible for promotion."
  limitations:
    - "Cases are internally authored and EFGM-aware."
    - "The explicit recovery checklist is aggregation-independent but not externally labeled."
    - "The current candidate prerequisite set is already known from EXP-0004 to be incomplete; this experiment demonstrates that verified recovery inherits that limitation."
    - "Residual-state completeness is limited to the currently modeled surface inventory."
    - "The two uncovered validation failures are tuning-visible after this run and must not be added to the current candidate and re-used as unseen confirmation."
    - "No sealed holdout was included or accessed."
