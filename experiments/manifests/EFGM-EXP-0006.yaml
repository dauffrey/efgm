experiment_id: EFGM-EXP-0006
title: "Agency Exposure versus Coherent Unsafe Execution semantic validation"
date: 2026-08-10
status: planned
research_type: falsification

hypothesis: "Agency Exposure (AE) and Coherent Unsafe Execution (CUE) are distinguishable constructs: AE captures insufficiently governed consequential capacity while CUE captures effective task execution operating through that exposure."
null_hypothesis: "AE and CUE do not provide reliably distinguishable information beyond one another, task flow, governance integrity, or a simpler independent checklist."
structural_invariant: "Because CUE = F_T * AE and normalized F_T is in [0,1], every valid scored case must satisfy 0 <= CUE <= AE <= 1. A generic low-AE/high-CUE quadrant is therefore impossible and must not be requested as a case-design target."
predeclared_success_criteria:
  - "Every generated/scored case satisfies CUE <= AE."
  - "When governance and agency inputs are held fixed while task effectiveness changes, AE remains stable while CUE changes in the expected direction."
  - "Independently authored labels distinguish high-AE/low-CUE exposure from high-AE/high-CUE execution without using EFGM terminology in the authoring instructions."
  - "AE adds useful information about uncontrolled capacity beyond CUE/task-flow alone on validation cases."
  - "CUE adds useful information about effective unsafe execution beyond AE alone on validation cases."
  - "Any incremental value survives reasonable perturbation and comparison with an independent two-axis checklist."
predeclared_failure_criteria:
  - "Any scored case violates CUE <= AE."
  - "Only the algebraic implementation contract separates AE and CUE; independent labels do not."
  - "One construct is redundant once task flow and governance integrity are known."
  - "A simpler independent exposure/execution checklist matches or exceeds both constructs at lower complexity."
  - "Results depend materially on internally authored EFGM-aware labels."

