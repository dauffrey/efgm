case_design:
  required_feasible_regions:
    - high_AE_high_CUE
    - high_AE_low_CUE
    - low_AE_low_CUE
  controlled_contrasts:
    - "Hold governance and agency fixed; vary task flow to isolate CUE while AE remains invariant."
    - "Hold task flow fixed; vary governance/agency to move AE and therefore the upper bound on CUE."
    - "Compare highly privileged/persistent but weak-execution cases against equally exposed strong-execution cases."
    - "Compare strong execution under low exposure against strong execution under high exposure."
    - "Include values near any proposed AE/CUE interpretation thresholds without inventing mathematically impossible regions."
  authoring_guardrail: "External case authors should not be shown AE/CUE formulas or EFGM preferred labels before authoring and labeling cases; case designers who enforce mathematical feasibility may know only the constraint CUE <= AE."

