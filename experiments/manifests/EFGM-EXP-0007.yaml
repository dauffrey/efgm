conclusion:
  decision: do_not_promote_narrow_v2_candidate
  rationale: "Frozen v2 aggregate classification falsely reassured on every catastrophic development and validation case in this cycle. The narrow prerequisite-plus-extreme-veto candidate detected all development catastrophes but only 66.67% in validation because four preregistered positive-control failures were outside its semantic path set. The broader aggregation-independent invariant checklist detected 100% of validation catastrophes with 0% false alarms, while the narrow candidate had -0.1666 incremental balanced accuracy. The floor-plus-max diagnostic detected all validation catastrophes but generated 12.50% false alarms, and the tested soft-percentile diagnostic detected none. The current narrow candidate therefore fails promotion."
  limitations:
    - "The cycle is internally authored and cannot establish generalization."
    - "The independent checklist is aggregation-independent but not externally labeled."
    - "The aggregate-only 100% false-reassurance result applies to this deliberately sparse adversarial case family, not all EFGM v2 use."
    - "No candidate threshold is canonical before validation and sealed-holdout support."
    - "No sealed holdout was included or accessed."
    - "The result rejects promotion of the narrow candidate, not every possible non-compensatory v2 diagnostic layer."
