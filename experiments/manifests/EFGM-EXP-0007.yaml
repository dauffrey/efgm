experiment_id: EFGM-EXP-0007
title: "Canonical EFGM v2 sparse-failure diagnostic comparison"
date: 2026-08-10
status: completed_development_validation_cycle
research_type: falsification

hypothesis: "A classification-only non-compensatory diagnostic layer can reduce the canonical EFGM v2 false reassurance demonstrated in EXP-0003 without changing frozen DQ and without producing unacceptable false alarms on benign controls."
null_hypothesis: "Positive-prerequisite floors, extreme-degradation vetoes, or soft-percentile diagnostics do not improve false-reassurance behavior beyond the frozen aggregate classifier or a simpler aggregation-independent invariant checklist."

motivation:
  parent_counterexample: EFGM-EXP-0003
  reason: "EXP-0003 demonstrated critical-dimension dilution in canonical v2 grounding, flow-quality, output-entropy, behavioral-entropy, and operational-entropy families. Agent Governance EXP-0004 does not resolve the canonical v2 failure."

predeclared_success_criteria:
  - "Frozen EFGM v2 DQ remains numerically unchanged because every candidate is applied only as a post-score diagnostic/classification comparison."
  - "At least one candidate diagnostic materially reduces false reassurance on preregistered sparse catastrophic cases."
  - "The same candidate does not produce an unacceptable false-alarm increase on preregistered benign low-score/high-penalty controls."
  - "The claimed mechanism survives path ablation, threshold sensitivity, and reasonable perturbation."
  - "Any promotion proposal must add validation value beyond the broader aggregation-independent invariant checklist."

predeclared_failure_criteria:
  - "A candidate catches authored catastrophes only by broadly flagging benign controls."
  - "A narrow candidate prerequisite set fails preregistered validation paths outside its semantic membership."
  - "A soft-percentile diagnostic misses one-dimensional sparse failures because neighboring observations dominate its percentile."
  - "The aggregation-independent invariant checklist matches or exceeds the candidate at lower or comparable operational complexity."
  - "Candidate thresholds or semantic membership are unstable under reasonable perturbation."
  - "Any implementation changes frozen DQ rather than remaining a diagnostic/classification comparison."

