measurement_discipline:
  - "Raw environment events are recorded before EFGM scoring."
  - "Environment labels never consume EFGM outputs."
  - "Telemetry-to-EFGM observation mapping must be deterministic, documented, unit-tested, and frozen before autonomous development trajectories are analyzed."
  - "Scripted trajectories may be used only to test instrumentation and must not count as evidence for H1-H5."
  - "Exploratory post-result constructs must be clearly separated from primary preregistered metrics."
  - "No validation obstacle family may be used to tune the telemetry adapter or primary warning interpretation."

