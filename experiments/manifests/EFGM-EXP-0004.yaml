experiment_id: EFGM-EXP-0004
title: "Agent-governance critical-dimension diagnostics"
date: 2026-08-10
status: planned
research_type: falsification

hypothesis: "A separate non-compensatory diagnostic layer will reduce false reassurance from sparse catastrophic governance failures without requiring replacement of the continuous v0.3 aggregate scores."
null_hypothesis: "Prerequisite-floor and low-percentile diagnostics do not reduce false reassurance relative to aggregate-only scoring, or they create unacceptable false alarms on benign low-score controls."
predeclared_success_criteria:
  - "Detect all preregistered catastrophic boundary/authorization/control collapses in the development suite."
  - "Materially reduce false reassurance versus aggregate-only classification."
  - "Do not materially increase false alarms on preregistered benign low-score controls."
  - "Provide incremental value beyond the independent invariant checklist on at least one validation dimension before any promotion proposal."
predeclared_failure_criteria:
  - "Diagnostic rules merely encode the authored labels without generalizing to validation cases."
  - "Independent checklist matches or exceeds diagnostic usefulness at materially lower complexity."
  - "Threshold choice is unstable under reasonable perturbation."

