conclusion:
  decision: do_not_promote_current_candidate_prerequisite_set
  rationale: "The configured prerequisite layer eliminated false reassurance on its covered development paths with no candidate-prerequisite false alarms, but validation exposed three preregistered catastrophic paths outside the configured set. Detection fell to 66.67%, the simpler aggregation-independent checklist achieved the same covered-path decisions, incremental balanced accuracy was 0.0000, and perturbation minimum-case correctness was 0.00%. Expanding the prerequisite set after observing these failures would be outcome-driven tuning; the current candidate is therefore retained as a failed/incomplete research candidate rather than promoted."
  limitations:
    - "Cases are internally authored and EFGM-terminology aware."
    - "The configured candidate prerequisite set is a research hypothesis, not an established control invariant."
    - "The independent checklist is independent of EFGM aggregation but is not an externally independently labeled comparator."
    - "No external sealed holdout was included or accessed."
    - "This result does not reject all non-compensatory governance approaches; it rejects promotion of the current configured prerequisite set from this cycle."
