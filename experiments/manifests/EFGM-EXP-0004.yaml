experiment_id: EFGM-EXP-0004
title: "Agent Governance critical-dimension diagnostics"
date: 2026-08-10
status: planned
research_type: falsification

hypothesis: "A non-compensatory diagnostic layer can reduce false reassurance from sparse catastrophic governance failures without treating every low observation as a prerequisite or replacing the continuous Agent Governance v0.3 aggregate scores."
null_hypothesis: "Observation-floor, low-percentile, and explicit candidate-prerequisite diagnostics do not reduce false reassurance relative to aggregate-only scoring, merely encode authored labels, or create unacceptable false alarms on benign low-score controls."
predeclared_success_criteria:
  - "The neutral governance observation floor exposes all preregistered sparse collapses without itself being interpreted as a prerequisite verdict."
  - "Only metric paths explicitly listed in the candidate configuration can produce candidate-prerequisite breaches."
  - "Detect all preregistered catastrophic boundary/authority/control failures covered by the candidate-prerequisite set in the development suite."
  - "Do not classify preregistered benign low observations outside the candidate-prerequisite set as prerequisite breaches."
  - "Materially reduce false reassurance versus aggregate-only classification."
  - "Do not materially increase false alarms on preregistered benign controls."
  - "Provide incremental value beyond the independent invariant checklist on at least one validation dimension before any promotion proposal."
predeclared_failure_criteria:
  - "The candidate prerequisite list merely encodes authored labels without generalizing to validation cases."
  - "A low non-prerequisite observation is incorrectly treated as a prerequisite failure."
  - "Independent checklist matches or exceeds diagnostic usefulness at materially lower complexity."
  - "Candidate prerequisite membership or threshold choice is unstable under reasonable perturbation/ablation."

