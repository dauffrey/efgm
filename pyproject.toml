[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efgm"
version = "0.1.0"
description = "Entropy-Flow Governance Model scoring framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
]

[project.scripts]
efgm-score = "efgm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
